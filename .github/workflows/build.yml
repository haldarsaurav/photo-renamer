name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public-source hygiene
        shell: pwsh
        run: ./verify-public.ps1
      - name: Run regression checks
        shell: pwsh
        run: ./test.ps1
      - name: Build and package
        shell: pwsh
        run: ./package.ps1
      - name: Upload portable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Photo-Renamer-Windows
          path: |
            dist/Photo-Renamer.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
